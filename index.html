function BarC({id,labels,data,colors,horizontal,refLine,maxX,xFormatter}){
  const ref=useRef();const inst=useRef();
  useEffect(()=>{
    if(!ref.current)return;
    if(inst.current)inst.current.destroy();
    const isDark=window.matchMedia("(prefers-color-scheme:dark)").matches;
    const tc=isDark?"#898781":"#898781";
    const gc=isDark?"rgba(255,255,255,0.08)":"#e1e0d9";
    const cfg={
      type:"bar",
      data:{labels,datasets:[{data,backgroundColor:colors||data.map(v=>rc(v)),borderRadius:4,borderSkipped:false}]},
      options:{
        indexAxis:horizontal?"y":"x",
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{
          callbacks:{label:ctx=>`${ctx.parsed[horizontal?"x":"y"].toFixed(1)}%`},
          backgroundColor:"var(--surface-2,#f3f3f0)",titleColor:tc,bodyColor:tc,
          borderColor:"var(--border,#e1e0d9)",borderWidth:1,padding:8,cornerRadius:8
        }},
        scales:{
          x:{
            max:horizontal?maxX:undefined,
            grid:{color:horizontal?gc:"transparent"},
            border:{display:false},
            ticks:{color:tc,font:{size:11},callback:horizontal?(v=>`${v>0?"+":""} ${v}%`):undefined}
          },
          y:{
            max:horizontal?undefined:105,
            grid:{color:horizontal?"transparent":gc},
            border:{display:false},
            ticks:{color:tc,font:{size:11},callback:horizontal?undefined:(v=>`${v}%`)}
          }
        }
      }
    };
    if(refLine!==undefined){
      cfg.plugins={...cfg.options.plugins};
      cfg.options.plugins.annotation={annotations:{ref:{type:"line",[horizontal?"xMin":"yMin"]:refLine,[horizontal?"xMax":"yMax"]:refLine,borderColor:"#2e6fd1",borderWidth:1.5,borderDash:[5,4]}}};
    }
    inst.current=new Chart(ref.current,cfg);
    return()=>inst.current&&inst.current.destroy();
  },[]);
  return React.createElement("div",{style:{position:"relative",width:"100%",height:"100%"}},
    React.createElement("canvas",{id,ref,"aria-hidden":"true"})
  );
}
